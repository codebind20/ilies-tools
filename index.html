<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ELIAS Tools | Free PDF, image, calculator and developer tools</title>
<meta name="description" content="Free online tools: merge PDFs, compress images, calculators, JSON formatter, password generator, QR codes and converters. Fast and private, everything runs in your browser.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1030">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A1030;--sf:#121A45;--ln:#2A367A;--tx:#EAF0FF;--mu:#9AA7D6;--y:#FFD400;--b:#5B7CFF;--pad:clamp(16px,5vw,64px)}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--tx);font:16px/1.55 'Space Grotesk',system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px var(--pad);position:sticky;top:0;z-index:5;background:rgba(10,16,48,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font-weight:700;font-size:20px;display:flex;gap:10px;align-items:center}
.logo i{width:30px;height:30px;background:var(--y);color:var(--ink);display:grid;place-items:center;border-radius:6px;font:700 16px 'JetBrains Mono',monospace}
.btn{background:var(--y);color:var(--ink);border:0;padding:10px 16px;border-radius:6px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
