<script>
const $=s=>document.querySelector(s),N=v=>parseFloat(v)||0,F=(n,d=2)=>(+n).toLocaleString('en',{maximumFractionDigits:d}),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const C={PDF:'📄',Image:'🖼️',Calculators:'🔢',Developer:'💻',Security:'🔐',Generators:'📱',Converters:'🌍'},T=[];
const add=(c,n,d,kw,f,r)=>T.push({c,n,d,kw:(n+' '+d+' '+kw).toLowerCase(),f,r});
const dl=(d,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d]));a.download=n;a.className='btn';a.textContent='Download '+n;return a};
const now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16),today=now.slice(0,10);
const ED=[['t','Text','area',''],['m','Mode','select','Encode',['Encode','Decode']]];
const U={Length:{m:1,km:1e3,cm:.01,mm:.001,mi:1609.344,yd:.9144,ft:.3048,in:.0254},Weight:{kg:1,g:.001,mg:1e-6,tonne:1e3,lb:.45359237,oz:.028349523},Speed:{'m/s':1,'km/h':1/3.6,mph:.44704,knot:.514444},'Data storage':{B:1,KB:1024,MB:1024**2,GB:1024**3,TB:1024**4},Temperature:{C:1,F:1,K:1}};
const UO=Object.fromEntries(Object.entries(U).map(([k,v])=>[k,Object.keys(v)]));
const Z=['Africa/Tunis','UTC','Europe/Paris','Europe/London','America/New_York','America/Los_Angeles','Asia/Dubai','Asia/Riyadh','Asia/Tokyo','Asia/Kolkata','Australia/Sydney'];

/* PDF */
add('PDF','PDF Toolkit','Merge, split, rotate PDFs and turn images into a PDF','pdf merge split rotate jpg to pdf images combine',[['p','Files','files','application/pdf,image/jpeg,image/png'],['m','Action','select','Merge PDFs',['Merge PDFs','Images to PDF','Split (page range)','Rotate all pages 90°']],['r','Page range for split (example 2-4)','text','1-2']],async v=>{
 if(!window.PDFLib)return'The PDF library could not load. Check your connection and reload.';
 if(!v.p.length)return'Choose one or more files.';
 const{PDFDocument:D,degrees}=PDFLib,o=await D.create(),m=v.m[0];
 if(m=='M'){for(const f of v.p){const s=await D.load(await f.arrayBuffer());(await o.copyPages(s,s.getPageIndices())).forEach(p=>o.addPage(p))}}
 else if(m=='I'){for(const f of v.p){const b=await f.arrayBuffer(),im=/png/i.test(f.type)?await o.embedPng(b):await o.embedJpg(b);o.addPage([im.width,im.height]).drawImage(im,{x:0,y:0,width:im.width,height:im.height})}}
 else{const s=await D.load(await v.p[0].arrayBuffer());
  if(m=='R'){s.getPages().forEach(p=>p.setRotation(degrees((p.getRotation().angle+90)%360)));return dl(await s.save(),'rotated.pdf')}
  let[a,b]=v.r.split('-').map(Number);a=Math.max(a||1,1);b=Math.min(b||a,s.getPageCount());const ix=[];for(let i=a;i<=b;i++)ix.push(i-1);
  if(!ix.length)return'Invalid page range.';(await o.copyPages(s,ix)).forEach(p=>o.addPage(p))}
 return dl(await o.save(),'elias.pdf')});

/* Image */
add('Image','Image Studio','Compress, resize, convert, rotate, blur and strip metadata','image compressor resizer jpg png webp converter rotator blur remove metadata exif',[['i','Image','file','image/*'],['f','Format','select','JPEG',['JPEG','PNG','WebP']],['q','Quality (0.1 to 1)','number',0.8],['w','Max width in px (0 keeps original)','number',0],['r','Rotate','select','0',['0','90','180','270']],['b','Blur in px','number',0]],async v=>{
 if(!v.i)return'Choose an image first.';
 const im=await createImageBitmap(v.i),k=N(v.w)>0?Math.min(1,N(v.w)/im.width):1,w=Math.round(im.width*k),h=Math.round(im.height*k),r=+v.r,c=document.createElement('canvas');
 c.width=r%180?h:w;c.height=r%180?w:h;const x=c.getContext('2d');
 if(v.f=='JPEG'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
 x.translate(c.width/2,c.height/2);x.rotate(r*Math.PI/180);x.filter=`blur(${N(v.b)}px)`;x.drawImage(im,-w/2,-h/2,w,h);
 const bl=await new Promise(o=>c.toBlob(o,'image/'+v.f.toLowerCase(),N(v.q)||.8)),d=document.createElement('div');
 d.innerHTML=`<img alt="Result" src="${URL.createObjectURL(bl)}" style="max-width:100%;border-radius:8px"><p>${F(v.i.size/1024,0)} KB to <b>${F(bl.size/1024,0)} KB</b>, ${c.width}×${c.height}px. Metadata removed.</p>`;
 d.append(dl(bl,'elias-image.'+(v.f=='JPEG'?'jpg':v.f.toLowerCase())));return d});
add('Image','Base64 to Image','Preview and save an image from a Base64 string','base64 image decode',[['t','Base64 string','area','']],v=>{const t=v.t.trim().replace(/["<>\s]/g,'');return t?`<img alt="Decoded" style="max-width:100%;border-radius:8px" src="${t.startsWith('data:')?t:'data:image/png;base64,'+t}">`:'Paste a Base64 string.'});

/* Calculators */
add('Calculators','Age Calculator','Exact age in years, months and days','birthday date of birth',[['d','Date of birth','date','2000-01-01']],v=>{const b=new Date(v.d),n=new Date();if(isNaN(b)||b>n)return'Enter a valid date.';let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return`<b>${y}</b> years, <b>${m}</b> months, <b>${d}</b> days\nTotal: ${F((n-b)/864e5,0)} days`});
add('Calculators','BMI Calculator','Body mass index from weight and height','weight height health',[['w','Weight (kg)','number',70],['h','Height (cm)','number',175]],v=>{const b=N(v.w)/(N(v.h)/100)**2;return isFinite(b)&&b>0?`BMI <b>${F(b,1)}</b>: ${b<18.5?'Underweight':b<25?'Normal weight':b<30?'Overweight':'Obese'}`:'Enter your weight and height.'});
add('Calculators','Percentage Calculator','Percent of a number, ratio and change','percent',[['a','A','number',20],['b','B','number',150]],v=>{const a=N(v.a),b=N(v.b);return`${a}% of ${b} = <b>${F(a*b/100)}</b>\n${a} is <b>${F(a/b*100)}%</b> of ${b}\nChange from ${a} to ${b}: <b>${F((b-a)/a*100)}%</b>`});
add('Calculators','Salary Calculator','Convert hourly, weekly, monthly and yearly pay','wage income pay',[['a','Amount','number',3000],['u','Per','select','month',['hour','week','month','year']],['h','Hours per week','number',40]],v=>{const h=N(v.h),K={hour:h*52,week:52,month:12,year:1},y=N(v.a)*K[v.u];return Object.keys(K).map(u=>`Per ${u}: <b>${F(y/K[u])}</b>`).join('\n')});
add('Calculators','Discount Calculator','Final price after a discount','sale price off',[['p','Price','number',100],['d','Discount %','number',20]],v=>{const s=N(v.p)*N(v.d)/100;return`You save <b>${F(s)}</b>\nFinal price: <b>${F(N(v.p)-s)}</b>`});
add('Calculators','Tip Calculator','Tip and split the bill','bill restaurant split',[['b','Bill','number',50],['t','Tip %','number',10],['n','People','number',2]],v=>{const t=N(v.b)*N(v.t)/100,s=N(v.b)+t;return`Tip: <b>${F(t)}</b>\nTotal: <b>${F(s)}</b>\nPer person: <b>${F(s/(N(v.n)||1))}</b>`});
add('Calculators','Loan Calculator','Monthly payment and total interest','mortgage credit repayment',[['a','Amount','number',10000],['r','Annual rate %','number',8],['y','Years','number',5]],v=>{const P=N(v.a),r=N(v.r)/1200,n=N(v.y)*12,m=r?P*r/(1-(1+r)**-n):P/n;return isFinite(m)?`Monthly payment: <b>${F(m)}</b>\nTotal paid: <b>${F(m*n)}</b>\nTotal interest: <b>${F(m*n-P)}</b>`:'Enter the loan details.'});
add('Calculators','Compound Interest Calculator','See how savings grow over time','investment savings',[['p','Starting amount','number',1000],['r','Annual rate %','number',6],['y','Years','number',10],['m','Monthly deposit','number',0]],v=>{const r=N(v.r)/1200,n=N(v.y)*12,P=N(v.p),M=N(v.m),t=P*(1+r)**n+(r?M*((1+r)**n-1)/r:M*n);return`Final balance: <b>${F(t)}</b>\nYou deposited: ${F(P+M*n)}\nInterest earned: <b>${F(t-P-M*n)}</b>`});
add('Calculators','Date Calculator','Days between two dates, or add days to a date','days between weeks',[['a','From','date',today],['b','To','date','2027-01-01'],['n','Days to add to "From"','number',30]],v=>{const a=new Date(v.a),b=new Date(v.b),d=Math.round((b-a)/864e5),x=new Date(a);x.setDate(x.getDate()+N(v.n));return isNaN(d)?'Pick two dates.':`Between the dates: <b>${d}</b> days (${F(d/7,1)} weeks)\n"From" plus ${N(v.n)} days: <b>${x.toDateString()}</b>`});

/* Developer */
add('Developer','Word and Character Counter','Words, characters, sentences and reading time','word counter character counter count letters',[['t','Text','area','']],v=>{const t=v.t,w=t.trim()?t.trim().split(/\s+/).length:0;return`Words: <b>${w}</b>\nCharacters: <b>${t.length}</b>\nCharacters without spaces: <b>${t.replace(/\s/g,'').length}</b>\nSentences: <b>${(t.match(/[.!?]+/g)||[]).length}</b>\nReading time: <b>${Math.ceil(w/200)}</b> min`});
add('Developer','Case Converter','UPPER, lower, Title, camelCase, snake_case','uppercase lowercase text',[['t','Text','area',''],['m','Mode','select','UPPER',['UPPER','lower','Title','Sentence','camelCase','snake_case','kebab-case']]],v=>{const t=v.t,w=t.toLowerCase().match(/[a-z0-9\u00c0-\u024f]+/g)||[];return esc({UPPER:t.toUpperCase(),lower:t.toLowerCase(),Title:t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()),Sentence:t.toLowerCase().replace(/(^\s*|[.!?]\s+)(\w)/g,(m,a,b)=>a+b.toUpperCase()),camelCase:w.map((x,i)=>i?x[0].toUpperCase()+x.slice(1):x).join(''),snake_case:w.join('_'),'kebab-case':w.join('-')}[v.m])});
add('Developer','JSON Formatter and Validator','Format, minify and validate JSON','json beautify',[['t','JSON','area','{"name":"ELIAS","tools":40}'],['m','Action','select','Format',['Format','Minify']]],v=>{try{return'✅ Valid JSON\n'+esc(JSON.stringify(JSON.parse(v.t),null,v.m=='Format'?2:0))}catch(e){return'❌ '+esc(e.message)}});
add('Developer','Base64 Encoder and Decoder','Convert text to Base64 and back','base64 encode decode',ED,v=>{try{return esc(v.m=='Encode'?btoa(String.fromCharCode(...new TextEncoder().encode(v.t))):new TextDecoder().decode(Uint8Array.from(atob(v.t.trim()),c=>c.charCodeAt(0))))}catch(e){return'❌ This is not valid Base64.'}});
add('Developer','URL Encoder and Decoder','Percent-encode or decode a URL','url encode decode',ED,v=>{try{return esc(v.m=='Encode'?encodeURIComponent(v.t):decodeURIComponent(v.t))}catch(e){return'❌ This is not a valid encoded URL.'}});
add('Developer','CSS Minifier','Shrink CSS code','minify css compress',[['t','CSS','area','']],v=>esc(v.t.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([{}:;,>])\s*/g,'$1').replace(/;}/g,'}').trim()));
add('Developer','UUID Generator','Random version 4 UUIDs','guid unique id',[['n','How many','number',5]],v=>Array.from({length:Math.min(N(v.n),50)},()=>crypto.randomUUID()).join('\n'));

/* Security */
add('Security','Password Generator','Strong random passwords','secure random',[['n','Length','number',16],['s','Symbols','select','Yes',['Yes','No']]],v=>{const c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'+(v.s=='Yes'?'!@#$%^*-_=+?':''),a=crypto.getRandomValues(new Uint32Array(Math.min(Math.max(N(v.n),4),128)));return`<b>${[...a].map(x=>c[x%c.length]).join('')}</b>`});
add('Security','Password Strength Checker','Estimate how strong a password is','password check entropy',[['p','Password (stays on your device)','text','']],v=>{const p=v.p,s=/[a-z]/.test(p)*26+/[A-Z]/.test(p)*26+/\d/.test(p)*10+/[^\w]/.test(p)*32,e=p.length*Math.log2(s||1);return p?`Entropy: <b>${F(e,0)}</b> bits\nStrength: <b>${e<40?'Weak':e<60?'Fair':e<80?'Strong':'Excellent'}</b>`:'Type a password to check it.'});
add('Security','Hash Generator','SHA-1, SHA-256 and SHA-512 hashes','hash checksum sha',[['t','Text','area',''],['m','Algorithm','select','SHA-256',['SHA-1','SHA-256','SHA-512']]],async v=>[...new Uint8Array(await crypto.subtle.digest(v.m,new TextEncoder().encode(v.t)))].map(b=>b.toString(16).padStart(2,'0')).join(''));
add('Security','Random Number Generator','Random whole numbers in a range','dice lottery',[['a','Minimum','number',1],['b','Maximum','number',100],['n','How many','number',1]],v=>{const a=N(v.a),b=N(v.b);return b<a?'Maximum must be higher than minimum.':Array.from({length:Math.min(N(v.n)||1,100)},()=>a+crypto.getRandomValues(new Uint32Array(1))[0]%(b-a+1)).join(', ')});

/* Generators */
add('Generators','QR Code Generator','Make a QR code for a link or text','qr link',[['t','Text or link','text','https://codebind20.github.io/Elias-khlifi/']],v=>{if(!window.QRCode)return'The QR library could not load. Check your connection and reload.';const d=document.createElement('div');d.style.cssText='background:#fff;padding:14px;display:inline-block;border-radius:8px';new QRCode(d,{text:v.t||' ',width:200,height:200});return d});
add('Generators','Lorem Ipsum Generator','Placeholder text for designs','dummy text filler',[['n','Paragraphs','number',3]],v=>Array(Math.min(N(v.n),20)).fill('Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.').join('\n\n'));
add('Generators','Gradient Generator','CSS gradient with a live preview','css color background',[['a','Color 1','color','#ffd400'],['b','Color 2','color','#000000'],['g','Angle in degrees','number',135]],v=>{const c=`linear-gradient(${N(v.g)}deg, ${v.a}, ${v.b})`;return`<div style="height:110px;border-radius:8px;background:${c};margin-bottom:10px"></div>background: <b>${c}</b>;`});
add('Generators','Color Palette Generator','Random five-color palettes','colors random hex',[],()=>{const p=Array.from({length:5},()=>'#'+[...crypto.getRandomValues(new Uint8Array(3))].map(x=>x.toString(16).padStart(2,'0')).join(''));return`<div style="display:flex;gap:6px;margin-bottom:10px">${p.map(c=>`<div style="flex:1;height:72px;border-radius:6px;background:${c}"></div>`).join('')}</div>${p.join('   ')}`});

/* Converters */
add('Converters','Unit Converter','Length, weight, temperature, speed and data storage','length weight temperature speed data storage converter',[['v','Value','number',1],['f','From','select','km',UO],['t','To','select','mi',UO]],v=>{let a,b,x=N(v.v);for(const c in U){if(v.f in U[c])a=c;if(v.t in U[c])b=c}if(a!=b)return'Choose two units of the same type.';if(a=='Temperature'){const k=v.f=='C'?x+273.15:v.f=='F'?(x-32)*5/9+273.15:x;return`<b>${F(v.t=='C'?k-273.15:v.t=='F'?(k-273.15)*9/5+32:k,4)}</b> ${v.t}`}return`${x} ${v.f} = <b>${F(x*U[a][v.f]/U[a][v.t],6)}</b> ${v.t}`});
add('Converters','Time Zone Converter','See one moment in time across the world','time zone clock world',[['d','Date and time','datetime-local',now],['z','This time is in','select','Africa/Tunis',Z]],v=>{if(!v.d)return'Pick a date and time.';const o=(ms,z)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:z,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-ms},g=Date.parse(v.d+'Z'),u=g-o(g,v.z);return Z.map(z=>`${z.padEnd(22)}<b>${new Date(u).toLocaleString('en-GB',{timeZone:z,dateStyle:'medium',timeStyle:'short'})}</b>`).join('\n')});

/* App */
let cat='All',q='',cur=0;
const opt=(o,v)=>Array.isArray(o)?o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join(''):Object.entries(o).map(([g,a])=>`<optgroup label="${g}">${opt(a,v)}</optgroup>`).join('');
function draw(){
 $('#chips').innerHTML=['All',...Object.keys(C)].map(c=>`<button class="chip${c==cat?' on':''}" onclick="cat='${c}';draw()">${C[c]||''} ${c}</button>`).join('');
 const L=T.map((t,i)=>[t,i]).filter(([t])=>(cat=='All'||t.c==cat)&&t.kw.includes(q));
 $('#grid').innerHTML=L.length?L.map(([t,i])=>`<button class="t" onclick="openT(${i})"><b>${t.n}</b><span>${t.d}</span><small>${t.c}</small></button>`).join(''):'<p class="empty">No tool found. Try another word.</p>';
}
function openT(i){
 cur=i;const t=T[i];$('#pt').textContent=t.n;$('#pd').textContent=t.d;
 $('#ff').innerHTML=t.f.map(([k,l,ty,v,o])=>`<label>${l}${ty=='area'?`<textarea name="${k}">${v}</textarea>`:ty=='select'?`<select name="${k}">${opt(o,v)}</select>`:ty=='file'||ty=='files'?`<input type="file" name="${k}" accept="${v}"${ty=='files'?' multiple':''}>`:`<input type="${ty}" name="${k}" value="${v}" step="any">`}</label>`).join('');
 $('#pn').classList.add('o');document.body.style.overflow='hidden';go();
}
function closeT(){$('#pn').classList.remove('o');document.body.style.overflow=''}
const val=()=>{const v={};document.querySelectorAll('#ff [name]').forEach(e=>v[e.name]=e.type=='file'?(e.multiple?[...e.files]:e.files[0]):e.value);return v};
async function go(){const o=$('#out');try{const r=await T[cur].r(val());typeof r=='string'?o.innerHTML=r:o.replaceChildren(r)}catch(e){o.textContent='❌ Something went wrong: '+e.message}}
function cp(){navigator.clipboard&&navigator.clipboard.writeText($('#out').innerText)}
function ask(){
 const s=$('#ask').value.trim().toLowerCase(),m=s.match(/([\d.]+)\s*%\s*(?:of|de)\s*([\d.]+)/);
 if(m){$('#ar').innerHTML=`${m[1]}% of ${m[2]} = ${F(m[1]*m[2]/100)}`;return}
 const w=s.split(/\s+/).filter(x=>x.length>2);let b=-1,n=0;
 T.forEach((t,i)=>{const sc=w.filter(x=>t.kw.includes(x)).length;if(sc>n){n=sc;b=i}});
 if(b<0){$('#ar').textContent='No match yet. Try words like “compress image”, “bmi”, “qr code” or “merge pdf”.';return}
 $('#ar').textContent='';openT(b);
}
$('#ff').addEventListener('input',go);
$('#s').placeholder='Search '+T.length+' tools';
$('#s').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw()});
$('#ask').addEventListener('keydown',e=>{if(e.key=='Enter')ask()});
$('#pn').addEventListener('click',e=>{if(e.target.id=='pn')closeT()});
addEventListener('keydown',e=>{if(e.key=='Escape')closeT()});
draw();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
